<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte de Fellive</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
:root{
  --abyss:#0a0c11; --ink:#12151d; --ink2:#1a1e29; --line:#2a3040; --line2:#3a4256;
  --shell:#ebe7dc; --mute:#9aa1b2; --faint:#6a7184;
  --soul:#bfe0f2; --infect:#f08a3c; --danger:#e0604f; --ok:#7cc48a;
  --display:"IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --sc:"Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--abyss);color:var(--shell);font-family:var(--body);font-size:15px;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--soul);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-inline:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;letter-spacing:.02em}
.brand .sess{font-family:var(--sc);color:var(--mute);letter-spacing:.08em;font-size:13px;display:flex;align-items:center;gap:6px}
.brand .sess input{width:4.2em;background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 6px;text-align:center;font-variant-numeric:tabular-nums}
.role{font-family:var(--sc);font-size:12px;letter-spacing:.1em;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mute)}
.role.live{color:var(--infect);border-color:#f08a3c66}
.role.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--infect);margin-right:6px;vertical-align:1px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
body.ro .tok{cursor:default}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--ink2);border:1px solid var(--line2);border-radius:6px;z-index:30;max-height:340px;overflow:auto;box-shadow:0 12px 30px #0009}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-bottom:1px solid var(--line)}
.results button:hover,.results button:focus-visible{background:#ffffff0d}
.results small{color:var(--mute);margin-left:auto;font-family:var(--sc);letter-spacing:.06em}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--sc);letter-spacing:.06em;font-size:13px;color:var(--mute)}
.tg[aria-pressed="true"]{border-color:var(--soul);color:var(--soul);background:#bfe0f212}
.tg.player[aria-pressed="true"]{border-color:var(--infect);color:var(--infect);background:#f08a3c14}

main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;min-height:0;padding-block:14px}
.mapwrap{position:relative;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:
  radial-gradient(ellipse at 50% 40%,#141926 0%,#0a0c11 70%)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.zone path{stroke-width:2.5;cursor:pointer;transition:fill-opacity .15s}
.zone:hover path{fill-opacity:.55}
.zone.sel path{stroke-width:5;fill-opacity:.6}
.zone.fog path{fill:url(#fog)!important;stroke-dasharray:8 6}
.zone text{font-family:var(--display);pointer-events:none;paint-order:stroke;stroke:#0a0c11;stroke-width:5px}
.zone.fog text{opacity:.45}
.tok{cursor:grab}
.tok.drag{cursor:grabbing}
.tok text{font-family:var(--sc);font-size:15px;fill:#ebe7dc;paint-order:stroke;stroke:#0a0c11;stroke-width:4px;pointer-events:none}
.tok.sel circle.ring{stroke:#fff;stroke-width:4}
.tok.gm circle.ring{stroke-dasharray:5 4}
.pass .hit{stroke:transparent;stroke-width:40;fill:none;cursor:pointer}
.pass .fl{fill:#07080c;fill-opacity:.92;pointer-events:none}
.pass .wall,.pass .cap{stroke:#d9cfb6;stroke-width:3;stroke-linecap:round;fill:none;pointer-events:none}
.pass .wall.tun{stroke-dasharray:10 7;stroke-opacity:.8}
.pass .ln{stroke:#d9cfb6;stroke-width:3;stroke-linecap:round;stroke-dasharray:0.1 8;stroke-opacity:.5;fill:none;pointer-events:none}
.pass .gate{stroke:#f08a3c;stroke-width:4;stroke-linecap:round;fill:none;pointer-events:none}
.pass.open .gate{stroke:#bfe0f2;stroke-dasharray:4 4}
.pass.open .wall,.pass.open .cap{stroke:#bfe0f2}
.pass:hover .wall,.pass:hover .cap{stroke:#fff6e0}
.pass:hover .gate{filter:drop-shadow(0 0 4px #f08a3c)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line2);border-radius:7px;overflow:hidden;width:100%}
.seg button{background:var(--abyss);border:0;border-left:1px solid var(--line);padding:7px 4px;font-family:var(--sc);letter-spacing:.05em;font-size:13px;color:var(--mute)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink2);color:var(--c);box-shadow:inset 0 -2px 0 var(--c)}
.seghint{font-size:12px;color:var(--faint);margin-top:4px}
.zone.l0 path{stroke-dasharray:8 6;stroke-opacity:.55}
.zone.l0 text{opacity:.55}
.zone.blob{pointer-events:none}
.zone.blob path{stroke:none!important}
.zone.blob.l2 path{fill-opacity:.32!important}
.zone.blob.l2.sel path{fill-opacity:.45!important}
.zone.blob.l2{pointer-events:auto}
.pass.unk{opacity:.4}
.pi .kn{font-size:12px;padding:4px 8px;color:var(--faint)}
.pi .kn[aria-pressed="true"]{color:var(--ok);border-color:#3c6b47}
.pi .eye{font-size:12px;padding:4px 8px;color:var(--mute)}
.pi .eye[aria-pressed="true"]{color:var(--danger);border-color:#6b3a3a}
.pi{flex-wrap:wrap;row-gap:6px}
.pi .tx{flex:1 1 calc(100% - 30px)}
.pi .kn{margin-left:26px}
.plist{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.pi{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--ink2);border:1px solid var(--line);border-radius:6px;font-size:14px}
.pi .ic{width:18px;text-align:center;font-weight:700;color:#d9cfb6;flex:none}
.pi .ic.gt{color:var(--infect)}
.pi .tx{flex:1;min-width:0}
.pi .tx small{display:block;color:var(--mute);font-size:12px;line-height:1.3;margin-top:3px}
.pi button{flex:none}
.mapctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:34px;height:34px;border-radius:6px;background:var(--ink2);border:1px solid var(--line2);font-size:18px;line-height:1}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--faint);max-width:60%}
.banner{position:absolute;left:12px;top:10px;right:12px;background:#f08a3c1c;border:1px solid #f08a3c66;color:#f6c49c;border-radius:6px;padding:6px 10px;font-size:13px}

aside{display:flex;flex-direction:column;min-height:0;background:var(--ink);border:1px solid var(--line);border-radius:10px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:11px 6px;font-family:var(--sc);letter-spacing:.08em;color:var(--mute);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--shell);border-bottom-color:var(--infect)}
.pane{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.zhead{display:flex;align-items:center;gap:10px}
.swatch{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid #fff3}
.zhead h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
.lbl{font-family:var(--sc);letter-spacing:.1em;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
textarea,.inp,select{width:100%;background:var(--abyss);border:1px solid var(--line);border-radius:6px;padding:8px 10px;line-height:1.45}
textarea{resize:vertical;min-height:70px}
textarea.secret{border-color:#6b3a3a;background:#1a0f10}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ink2);border:1px solid var(--line2);border-radius:6px;padding:6px 11px;font-size:14px}
.btn.pri{background:var(--infect);border-color:var(--infect);color:#1a0d02;font-weight:700}
.btn.warn{color:var(--danger);border-color:#6b3a3a}
.btn:disabled{opacity:.45;cursor:default}
.saved{font-size:12px;color:var(--faint);font-family:var(--body);letter-spacing:0}
.empty{color:var(--faint);font-style:italic;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{border-color:var(--line2)}
.card .ph{aspect-ratio:1;background:#0c0f15 center/cover no-repeat;display:grid;place-items:center;font-family:var(--display);font-size:34px;color:var(--line2);max-width:100%}
.card .nm{padding:6px 8px 2px;font-weight:500;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.card .meta{padding:0 8px 8px;display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--sc);font-size:11px;letter-spacing:.06em;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.dead{opacity:.5}
.dead .ph{filter:grayscale(1)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters select{width:auto;flex:1 1 120px;padding:5px 8px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--ink2);border:1px solid var(--line);border-radius:6px}
.li.sel{border-color:var(--soul)}
.li .dot{width:22px;height:22px;border-radius:50%;flex:none;background:#333 center/cover}
.li input{flex:1;min-width:0;background:none;border:0;padding:2px}
.li button{background:none;border:0;color:var(--mute);padding:2px 5px}
.li button:hover{color:var(--shell)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}

dialog{background:var(--ink);color:var(--shell);border:1px solid var(--line2);border-radius:12px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:#000b}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.ent-top{display:grid;grid-template-columns:140px 1fr;gap:14px}
.portrait{aspect-ratio:1;border-radius:8px;background:#0c0f15 center/cover no-repeat;border:1px dashed var(--line2);display:grid;place-items:center;color:var(--faint);font-size:13px;text-align:center;padding:8px;max-width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  aside{min-height:60vh}
}
@media (max-width:480px){.ent-top{grid-template-columns:1fr}.portrait{max-width:180px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
<header>
  <div class="brand">
    <h1>Carte de Fellive</h1>
    <span id="roleTag" class="role">MJ</span>
    <label class="sess" for="sessNum">Séance <input id="sessNum" type="number" min="1" value="10"></label>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Chercher une zone, un PNJ, un ennemi…" autocomplete="off">
    <div id="results" class="results" hidden></div>
  </div>
  <div class="toggles">
    <button class="tg" id="tgOrig" aria-pressed="false">Calque original</button>
    <button class="tg" id="tgLabels" aria-pressed="true">Noms</button>
    <button class="tg" id="tgPass" aria-pressed="true">Passages</button>
    <button class="tg" id="btnLogin" hidden>Connexion MJ</button>
    <button class="tg" id="btnLogout" hidden>Déconnexion</button>
    <button class="tg player" id="tgPlayer" aria-pressed="false" title="Cache les secrets, les jetons MJ et ce que le groupe ne connaît pas">Vue joueurs</button>
  </div>
</header>
<main>
  <div class="mapwrap">
    <svg id="map" viewBox="0 0 1584 1282" aria-label="Carte des zones">

// Passages : libre = a<->b ; sens unique = verrouillé côté b (barre du T), s'ouvre depuis a

const PASSAGES = [

 {id:"p15", a:"queens-heaven", b:"darkwater", g:V(1148,597,617)},

  {k:0,label:"Inconnue",color:"var(--faint)",hint:"Les joueurs ignorent son existence"},

const lvl = id=>{const st=S.zones[id]||{}; return typeof st.level==="number"?st.level:(st.discovered?3:0);};
const zn = id=>(S.player&&lvl(id)<3)?(lvl(id)===2?"Zone visitée":"Zone inconnue"):(ZMAP[id]?.name||id);
const pVisible = p=>!S.hid[p.id] && (!!S.known[p.id] || lvl(p.a)===3 || lvl(p.b)===3);
const pSave = id=>save("passages/"+id,{opened:!!S.opened[id],known:!!S.known[id],hidden:!!S.hid[id]});
function passLabel(p){
  const opened=S.opened[p.id];
  if(!p.oneway) return {ic:"—",t:"Passage libre"};
  if(opened) return {ic:"⊥",t:"Raccourci ouvert"};
  return {ic:"⊥",t:`Verrouillé côté ${zn(p.b)} — s'ouvre depuis ${zn(p.a)}`};
}
const KINDS = {
  joueur:{label:"Joueur",color:"#ebe7dc"},

  ennemi:{label:"Ennemi",color:"#e0604f"},

};
const STATUS = {vivant:"Vivant", mort:"Mort", inconnu:"Inconnu", allie:"Allié", hostile:"Hostile"};

// ---------- État ----------
const S = {zones:{}, entities:{}, tokens:{}, meta:{}, world:{}, opened:{}, known:{}, hid:{}, images:{}, passages:true, sel:null, selTok:null, tab:"zone",
  player:false, labels:true, filterZone:"", filterKind:"", filterQ:""};
let db=null, assets=null, user=null, BASE="";
S.role="gm";           // "gm" (propriétaire) ou "player" (tous les autres, lecture seule)
const RO=()=>S.role==="player";
const P_=p=>BASE+p;    // chemin privé MJ
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const img = id=>id?(S.images[id]||""):"";
const SVGNS="http://www.w3.org/2000/svg";

function banner(msg){const b=$("#banner"); b.textContent=msg||""; b.hidden=!msg;}

// Écritures (une à la fois par doc, avec anti-rebond)
const pending={}, timers={}, busy={};
function save(path,data,delay=0){
  if(RO()) return;
  pending[path]=data; clearTimeout(timers[path]);
  timers[path]=setTimeout(()=>flush(path),delay);
}
async function flush(path){
  if(!db||busy[path]||!(path in pending)) return;
  const data=pending[path]; delete pending[path]; busy[path]=true;
  try{ await db.doc(P_(path)).set(data); markSaved(); schedulePub(); }
  catch(e){ banner("Échec de sauvegarde ("+(e.code||"erreur")+"). Vérifie ta connexion puis modifie à nouveau."); }
  finally{ busy[path]=false; if(path in pending) flush(path); }
}
async function remove(path){ if(db&&!RO()){ try{await db.doc(P_(path)).delete(); schedulePub();}catch(e){banner("Suppression impossible ("+(e.code||"erreur")+").");} } }
// ---------- Projection publique (ce que voient les joueurs) ----------
let pubTimer=null, lastPub="", loaded=false;
function buildPub(){
  const zones={}, passages={}, entities={}, tokens={};
  for(const z of ZONES){ const L=lvl(z.id); if(!L) continue; const st=S.zones[z.id]||{};
    zones[z.id]={level:L}; if(L>=2) zones[z.id].desc=st.desc||""; if(L===3) zones[z.id].lore=st.lore||""; }
  for(const p of PASSAGES){ if(pVisible(p)) passages[p.id]={opened:!!S.opened[p.id]}; }
  for(const e of Object.values(S.entities)){ if(e.hiddenFromPlayers) continue;
    entities[e.id]={name:e.name||"",kind:e.kind||"pnj",status:e.status||"inconnu",desc:e.desc||"",imageId:e.imageId||"",zone:e.zone&&lvl(e.zone)===3?e.zone:""}; }
  for(const t of Object.values(S.tokens)){ if(t.hidden) continue;
    tokens[t.id]={x:t.x,y:t.y,kind:t.kind,label:t.label||"",entityId:t.entityId&&entities[t.entityId]?t.entityId:""}; }
  return {v:1,session:S.meta.session??10,intro:S.world.intro||"",zones,passages,entities,tokens};
}
function schedulePub(delay=500){
  if(RO()||!db||!loaded) return;
  clearTimeout(pubTimer); pubTimer=setTimeout(pushPub,delay);
}
let pubBusy=false; const pubImgs=new Set();
async function pushPub(){
  if(pubBusy){ schedulePub(300); return; }
  const data=buildPub(), js=JSON.stringify(data);
  if(js===lastPub) return;
  pubBusy=true;
  try{
    // images publiques : uniquement celles des fiches visibles
    const want=new Set(Object.values(data.entities).map(e=>e.imageId).filter(id=>id&&S.images[id]));
    for(const id of want) if(!pubImgs.has(id)){ await db.doc("pubimg/"+id).set({data:S.images[id]}); pubImgs.add(id); }
    for(const id of [...pubImgs]) if(!want.has(id)){ await db.doc("pubimg/"+id).delete(); pubImgs.delete(id); }
    await db.doc("pub/state").set(data); lastPub=js;
  }
  catch(e){ banner("La vue joueurs n'a pas pu être mise à jour ("+(e.code||"erreur")+")."); }
  finally{ pubBusy=false; }
}
function markSaved(){ const el=document.querySelector("[data-saved]"); if(el){el.textContent="Enregistré"; clearTimeout(markSaved.t); markSaved.t=setTimeout(()=>el.textContent="",1500);} }

// ---------- Carte ----------
const svg=$("#map");
let VB={x:0,y:0,w:1584,h:1282};
function setVB(){svg.setAttribute("viewBox",`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);}
function pt(e){const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoom(f,cx,cy){
  cx??=VB.x+VB.w/2; cy??=VB.y+VB.h/2;
  const nw=Math.min(2400,Math.max(260,VB.w*f)), k=nw/VB.w;
  VB={x:cx-(cx-VB.x)*k,y:cy-(cy-VB.y)*k,w:nw,h:VB.h*k}; setVB();
}
$("#zin").onclick=()=>zoom(.8); $("#zout").onclick=()=>zoom(1.25);
$("#zfit").onclick=()=>{VB={x:0,y:0,w:1584,h:1282};setVB();};
svg.addEventListener("wheel",e=>{e.preventDefault(); const p=pt(e); zoom(e.deltaY>0?1.12:.89,p.x,p.y);},{passive:false});

function renderZones(){
  const g=$("#zones"); g.innerHTML="";
  const txt=(z,lines,fill,fs)=>S.labels?`<text x="${z.lx}" y="${z.ly}" text-anchor="middle" fill="${fill}" font-size="${fs}">${lines.map((l,i)=>`<tspan x="${z.lx}" dy="${i?fs*1.1:0}">${esc(l)}</tspan>`).join("")}</text>`:"";
  for(const z of ZONES){
    const L=lvl(z.id);
    const el=document.createElementNS(SVGNS,"g");
    el.dataset.zone=z.id;
    if(S.player && L<3){
      if(L===0) continue;
      el.setAttribute("class",`zone blob l${L}`+(S.sel===z.id?" sel":""));
      el.innerHTML = L===1
        ? `<path d="${z.d}" fill="#c9b98f" fill-opacity=".16" stroke="none" filter="url(#blurK)"/>`+txt(z,["?"],"#c9b98f",z.small?20:44)
        : `<path d="${z.d}" fill="${z.color}" fill-opacity=".32" stroke="none" filter="url(#blurV)"/>`+txt(z,["???"],z.color,z.small?14:28)+`<title>Zone visitée — non cartographiée</title>`;
      g.appendChild(el); continue;
    }
    el.setAttribute("class",`zone l${L}`+(S.sel===z.id?" sel":""));
    el.innerHTML=`<path d="${z.d}" fill="${z.color}" fill-opacity="${[0.07,0.13,0.2,0.28][L]}" stroke="${z.color}"/>`+
      txt(z,z.lines,z.color,z.fs)+`<title>${esc(z.name)} — ${LEVELS[L].label}</title>`;
    g.appendChild(el);
  }
}

function renderPassages(){
  const g=$("#passages"); g.innerHTML="";
  if(!S.passages) return;
  for(const p of PASSAGES){
    const vis=pVisible(p);
    if(S.player && !vis) continue;
    const open=!!S.opened[p.id], lab=passLabel(p);
    const G=p.g, W=34, E=15, hw=W/2, t0=G.s-E, t1=G.e+E;
    const P=(al,ac)=>G.o==="v"?[G.k+ac,al]:[al,G.k+ac];
    const seg=(a1,c1,a2,c2)=>{const [x1,y1]=P(a1,c1),[x2,y2]=P(a2,c2);return `M${x1} ${y1} L${x2} ${y2}`;};
    const [rx,ry]=P(t0,-hw), [rx2,ry2]=P(t1,hw);
    const floor=`<rect class="fl" x="${Math.min(rx,rx2)}" y="${Math.min(ry,ry2)}" width="${Math.abs(rx2-rx)}" height="${Math.abs(ry2-ry)}"/>`;
    const walls=seg(t0,-hw,t1,-hw)+" "+seg(t0,hw,t1,hw);
    const caps=[t0,t1].map(t=>seg(t,-hw-5,t,-hw+2)+" "+seg(t,hw-2,t,hw+5)).join(" ");
    const mid=seg(t0+7,0,t1-7,0);
    let bar="";
    if(p.oneway){
      const gp=G.gate==="s"?G.s:G.e, dir=G.gate==="s"?1:-1;
      const teeth=[-10,0,10].map(o=>seg(gp,o,gp+dir*9,o)).join(" ");
      bar=`<path class="gate" d="${seg(gp,-hw+3,gp,hw-3)} ${teeth}"/>`;
    }
    const el=document.createElementNS(SVGNS,"g");
    el.setAttribute("class","pass"+(open?" open":"")+(!S.player&&!vis?" unk":""));
    el.dataset.pass=p.id;
    el.innerHTML=`<title>${esc(zn(p.a))} ↔ ${esc(zn(p.b))} · ${esc(lab.t)}${p.oneway&&!S.player?" (clic : "+(open?"reverrouiller":"marquer ouvert")+")":""}</title>${floor}<path class="ln" d="${mid}"/><path class="wall${G.tunnel?" tun":""}" d="${walls}"/><path class="cap" d="${caps}"/>${bar}<path class="hit" d="${walls} ${mid}"/>`;
    g.appendChild(el);
  }
}
function togglePass(id){
  const p=PMAP[id]; if(!p?.oneway||S.player) return;
  S.opened[id]=!S.opened[id]; pSave(id); renderPassages(); if(S.tab==="zone") renderPane();
}
function tokenImage(t){
  const e=t.entityId&&S.entities[t.entityId];
  return e&&e.imageId?img(e.imageId):"";
}
function renderTokens(){
  const g=$("#tokens"); g.innerHTML="";
  const list=Object.values(S.tokens).sort((a,b)=>(a.kind==="joueur")-(b.kind==="joueur"));
  for(const t of list){
    if(S.player && t.hidden) continue;
    const k=KINDS[t.kind]||KINDS.marqueur, r=t.kind==="boss"?30:24, src=tokenImage(t);
    const el=document.createElementNS(SVGNS,"g");
    el.setAttribute("class","tok"+(S.selTok===t.id?" sel":"")+(t.hidden?" gm":""));
    el.setAttribute("transform",`translate(${t.x},${t.y})`);
    el.dataset.tok=t.id;
    const ini=esc((t.label||"?").trim().slice(0,1).toUpperCase());
    el.innerHTML=`<circle r="${r}" fill="#0a0c11"/>`+
      (src?`<image href="${esc(src)}" x="${-r}" y="${-r}" width="${2*r}" height="${2*r}" clip-path="url(#tokclip)" preserveAspectRatio="xMidYMid slice"/>`
          :`<circle r="${r-3}" fill="${k.color}" fill-opacity=".25"/><text y="7" text-anchor="middle" style="font-size:22px">${ini}</text>`)+
      `<circle class="ring" r="${r}" fill="none" stroke="${k.color}" stroke-width="3"/>`+
      `<text y="${r+18}" text-anchor="middle">${esc(t.label||"")}</text>`;
    g.appendChild(el);
  }
}
function render(){renderZones();renderPassages();renderTokens();renderPane();}

// Interaction carte : pan / clic zone / drag jeton
let drag=null;
svg.addEventListener("pointerdown",e=>{
  const tok=e.target.closest(".tok");
  const p=pt(e);
  if(tok&&!RO()){
    const t=S.tokens[tok.dataset.tok]; if(!t) return;
    drag={type:"tok",id:t.id,ox:p.x-t.x,oy:p.y-t.y,moved:false,el:tok};
    tok.classList.add("drag");
  } else {
    drag={type:"pan",sx:e.clientX,sy:e.clientY,vb:{...VB},moved:false,zone:e.target.closest(".zone")?.dataset.zone,pass:e.target.closest(".pass")?.dataset.pass};
  }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(drag.type==="tok"){
    const p=pt(e), t=S.tokens[drag.id];
    t.x=Math.round(p.x-drag.ox); t.y=Math.round(p.y-drag.oy); drag.moved=true;
    drag.el.setAttribute("transform",`translate(${t.x},${t.y})`);
    schedulePub(350);
  } else {
    const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
    if(Math.hypot(dx,dy)>4) drag.moved=true;
    if(drag.moved){
      const s=drag.vb.w/svg.getBoundingClientRect().width;
      VB={...drag.vb,x:drag.vb.x-dx*s,y:drag.vb.y-dy*s}; setVB();
    }
  }
});
svg.addEventListener("pointerup",()=>{
  if(!drag) return;
  const d=drag; drag=null;
  if(d.type==="tok"){
    d.el.classList.remove("drag");
    S.selTok=d.id;
    if(d.moved){ const t=S.tokens[d.id]; save("tokens/"+t.id,{...t}); }
    renderTokens(); if(S.tab==="tokens") renderPane();
  } else if(!d.moved){
    if(d.pass){ const p=PMAP[d.pass]; if(p.oneway&&!S.player) togglePass(d.pass); else if(!RO()||lvl(p.a)>=2) selectZone(p.a); } else if(d.zone){ if(!S.player||lvl(d.zone)>=2) selectZone(d.zone); } else { S.selTok=null; renderTokens(); }
  }
});
window.addEventListener("keydown",e=>{
  if(e.key==="Delete"&&!RO()&&S.selTok&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) delToken(S.selTok);
});

function syncTabs(){document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;syncTabs();renderPane();});

  </button>`;

function zoneOptions(sel,withAll){

function renderPane(){
  const p=$("#pane");
  if(S.tab==="zone") return paneZone(p);
  if(S.tab==="bank") return paneBank(p);
  return paneTokens(p);
}

function paneZone(p){
  if(!S.sel){
    const counts=[0,1,2,3].map(k=>ZONES.filter(z=>lvl(z.id)===k).length);
    const shown=ZONES.filter(z=>!S.player||lvl(z.id)>=2);
    p.innerHTML=`<div class="zhead"><h2>Fellive</h2></div>
      <p class="empty" style="font-style:normal;color:var(--mute);margin:0">${RO()?"La carte se met à jour en direct pendant la partie. Clique une zone connue pour lire sa description.":"Clique une zone sur la carte pour afficher son lore, ses secrets et ses habitants."}</p>
      <div><div class="lbl">${RO()?"Prologue":"Prologue (à lire aux joueurs)"} <span class="saved" data-saved></span></div>
      ${RO()?`<p style="margin:0;font-style:italic;line-height:1.5">${esc(S.world.intro||"")}</p>`:`<textarea id="wIntro" rows="3" placeholder="La phrase d'ouverture du royaume…">${esc(S.world.intro||"")}</textarea>`}</div>
      ${S.player?"":`<details id="wHistD" ${S.histOpen?"open":""}><summary class="lbl" style="cursor:pointer;display:list-item">Histoire de Fellive — MJ</summary>
      <textarea id="wHist" class="secret" rows="16" placeholder="Origine du royaume, chute, état actuel…">${esc(S.world.history||"")}</textarea></details>`}
      <div><div class="lbl">Connaissance du groupe <span style="font-variant-numeric:tabular-nums;letter-spacing:.02em">${S.player?`${counts[3]} découvertes · ${counts[2]} visitées`:LEVELS.slice(1).map(l=>`${counts[l.k]} ${l.label.toLowerCase()}${counts[l.k]>1?"s":""}`).join(" · ")}</span></div>
      <div class="list">${shown.map(z=>{const L=lvl(z.id);const n=Object.values(S.entities).filter(e=>e.zone===z.id).length;
        return `<button type="button" class="li" data-goto="${z.id}" style="text-align:left;cursor:pointer"><span class="swatch" style="background:${z.color}"></span><span style="flex:1">${esc(zn(z.id))}</span><small style="color:var(--faint)">${n&&!S.player?n+" fiche"+(n>1?"s":""):""}</small><span class="chip" style="color:${LEVELS[L].color}">${LEVELS[L].label}</span></button>`}).join("")}</div></div>
      ${RO()?"":`<div><div class="lbl">Notes de campagne <span class="saved" data-saved></span></div>
      <textarea id="campNotes" rows="6" placeholder="Fils rouges, promesses faites aux PNJ, retours de la réunion checkup…">${esc(S.meta.notes||"")}</textarea></div>`}`;
    p.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>selectZone(b.dataset.goto));
    if(RO()) return;
    $("#wIntro").oninput=e=>{S.world.intro=e.target.value; save("meta/intro",{text:S.world.intro},800);};
    const wh=$("#wHist"); if(wh){ wh.oninput=e=>{S.world.history=e.target.value; save("meta/history",{text:S.world.history},800);}; $("#wHistD").ontoggle=e=>{S.histOpen=e.target.open;}; }
    $("#campNotes").oninput=e=>{S.meta.notes=e.target.value; save("meta/campaign",{...S.meta},800);};
    return;

async function uploadFor(e,file){
  if(!file) return;
  const msg=$("#uplMsg"), btn=$("#upl");
  msg.textContent="Envoi…"; btn.disabled=true;
  try{
    const r=await assets.upload(file);
    const old=e.imageId; e.imageId=r.id;
    const pic=$("#portrait"); pic.style.backgroundImage=`url('${r.url}')`; pic.style.borderStyle="solid"; pic.textContent="";
    msg.textContent="Image ajoutée";
    if(S.entities[e.id]){ S.entities[e.id].imageId=r.id; save("entities/"+e.id,{...S.entities[e.id]}); render(); }
    if(old&&old!==r.id){ try{await assets.delete(old);}catch{} }
  }catch(err){
    msg.textContent={too_large:"Image trop lourde même après compression.",unsupported_type:"Format non accepté : PNG, JPG, WebP ou GIF.",quota_or_state:"Stockage plein : supprime des images inutiles.",rate_limited:"Trop d'envois d'affilée, réessaie dans un instant."}[err.code]||"Échec de l'envoi ("+(err.code||"erreur")+").";
  }finally{ btn.disabled=false; }
}
function refreshTokensLabels(e){
  Object.values(S.tokens).filter(t=>t.entityId===e.id&&(t.label!==e.name||t.kind!==e.kind)).forEach(t=>{t.label=e.name;t.kind=e.kind;save("tokens/"+t.id,{...t});});
}

async function pickSeed(){
  return new Promise((res,rej)=>{
    const f=document.createElement("input"); f.type="file"; f.accept="application/json,.json";
    f.onchange=async()=>{ try{ res(JSON.parse(await f.files[0].text())); }catch(e){ rej({code:"fichier illisible"}); } };
    f.click();
  });
}
async function importSeed(){
  const flag=await db.doc(P_("meta/migrated")).get();
  if(flag.exists) return;
  // Base vide : proposer l'import du fichier de données (jamais mis en ligne)
  await new Promise(done=>{
    const b=$("#banner"); b.hidden=false;
    b.innerHTML='Base vide. <button class="btn pri" id="impBtn" type="button">Importer fellive-donnees.json</button> <button class="btn" id="skipBtn" type="button">Commencer vide</button>';
    $("#skipBtn").onclick=async()=>{ await db.doc(P_("meta/migrated")).set({at:Date.now(),empty:true}); banner(""); done(); };
    $("#impBtn").onclick=async()=>{
      try{
        const SEED=await pickSeed();
        banner("Import en cours…");
        for(const col of ["zones","entities","passages","meta"])
          for(const [id,d] of Object.entries(SEED[col]||{})){
            const r=db.doc(P_(col+"/"+id)); if(!(await r.get()).exists) await r.set(d);
          }
        await db.doc(P_("meta/migrated")).set({at:Date.now()});
        banner(""); done();
      }catch(e){ banner("Import impossible ("+(e.code||"erreur")+"). Recharge et réessaie."); }
    };
  });
}

// Images : compressées dans le navigateur puis stockées dans la base (pas besoin de stockage payant)
async function compressImage(file){
  if(!/^image\//.test(file.type)) throw {code:"unsupported_type"};
  const bmp=await createImageBitmap(file);
  let size=560, q=.82, out="";
  for(let i=0;i<6;i++){
    const k=Math.min(1,size/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    out=c.toDataURL("image/webp",q);
    if(!out.startsWith("data:image/webp")) out=c.toDataURL("image/jpeg",q);
    if(out.length<600000) return out;
    size*=.8; q-=.08;
  }
  throw {code:"too_large"};
}
function makeAssets(){
  return {
    upload: async file=>{ const data=await compressImage(file); const id=uid(); await db.doc(P_("images/"+id)).set({data}); S.images[id]=data; return {id,url:data}; },
    delete: async id=>{ await db.doc(P_("images/"+id)).delete(); },
  };
}

function startPlayer(){
  const onErr=e=>banner("Connexion perdue ("+(e.code||"erreur")+"). Recharge la page.");
  db.collection("pubimg").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()?.data||""); S.images=m; render(); },onErr);
  db.doc("pub/state").onSnapshot(d=>{
    const P=d.exists?(d.data()||{}):{};
    if(!d.exists) banner("Le MJ n'a pas encore ouvert la carte.");
    else if(/n'a pas encore ouvert/.test($("#banner").textContent)) banner("");
    S.zones={}; for(const [id,z] of Object.entries(P.zones||{})) S.zones[id]={...z};
    S.opened={}; S.known={}; S.hid={};
    for(const p of PASSAGES){ const v=(P.passages||{})[p.id]; if(v){ S.known[p.id]=true; S.opened[p.id]=!!v.opened; } else S.hid[p.id]=true; }
    S.entities={}; for(const [id,e] of Object.entries(P.entities||{})) S.entities[id]={...e,id};
    S.tokens={}; for(const [id,t] of Object.entries(P.tokens||{})) S.tokens[id]={...t,id};
    S.world={intro:P.intro||""}; S.meta={session:P.session??10};
    $("#sessNum").value=S.meta.session;
    if(S.sel&&lvl(S.sel)<2) S.sel=null;
    render();
  },onErr);
}

function startGM(){
  const onErr=e=>banner("Connexion aux données perdue ("+(e.code||"erreur")+"). Recharge la page.");
  const need=new Set(["zones","entities","tokens","passages","intro","history","campaign"]);
  const ready=k=>{ if(!need.has(k)) return; need.delete(k); if(!need.size){ loaded=true; schedulePub(0); } };
  const sub=(col,key)=>db.collection(P_(col)).onSnapshot(snap=>{
    const next={}; snap.docs.forEach(d=>{ next[d.id]={...d.data(),id:d.id}; });
    for(const p in pending){ const [c,id]=p.split("/"); if(c===col&&pending[p]) next[id]={...pending[p]}; }
    if(key==="tokens"&&drag?.type==="tok"&&S.tokens[drag.id]) next[drag.id]=S.tokens[drag.id];
    S[key]=next; ready(key);
    const active=document.activeElement;
    if(active&&/TEXTAREA|INPUT/.test(active.tagName)&&active.closest("#pane,dialog")){ renderZones(); renderPassages(); renderTokens(); }
    else render();
    schedulePub();
  },onErr);
  sub("zones","zones"); sub("entities","entities"); sub("tokens","tokens");
  need.add("images"); need.add("pubimg");
  db.collection(P_("images")).onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()?.data||""); S.images=m; ready("images"); render(); schedulePub(); },onErr);
  db.collection("pubimg").get().then(snap=>{ snap.docs.forEach(d=>pubImgs.add(d.id)); ready("pubimg"); }).catch(()=>ready("pubimg"));
  db.collection(P_("passages")).onSnapshot(snap=>{
    const o={}, kn={}, hd={}; snap.docs.forEach(d=>{ o[d.id]=!!d.data()?.opened; kn[d.id]=!!d.data()?.known; hd[d.id]=!!d.data()?.hidden; });
    for(const k in pending){ if(k.startsWith("passages/")){ o[k.slice(9)]=!!pending[k].opened; kn[k.slice(9)]=!!pending[k].known; hd[k.slice(9)]=!!pending[k].hidden; } }
    S.opened=o; S.known=kn; S.hid=hd; ready("passages"); renderPassages(); schedulePub();
    if(S.tab==="zone"&&S.sel&&!/TEXTAREA|INPUT/.test(document.activeElement?.tagName||"")) renderPane();
  },onErr);
  const txt=(docName,field)=>db.doc(P_("meta/"+docName)).onSnapshot(d=>{
    ready(docName);
    if(pending["meta/"+docName]) return;
    S.world[field]=d.exists?(d.data()?.text||""):"";
    if(S.tab==="zone"&&!S.sel&&!["wIntro","wHist","campNotes"].includes(document.activeElement?.id)) renderPane();
    schedulePub();
  },onErr);
  txt("intro","intro"); txt("history","history");
  db.doc(P_("meta/campaign")).onSnapshot(d=>{
    ready("campaign");
    if(pending["meta/campaign"]) return;
    S.meta=d.exists?(d.data()||{}):{session:10};
    const sn=$("#sessNum"); if(document.activeElement!==sn) sn.value=S.meta.session??10;
    if(S.tab==="zone"&&!S.sel&&document.activeElement?.id!=="campNotes") renderPane();
    schedulePub();
  },onErr);
}

render();
let auth=null, started=false;
function showLogin(u){
  $("#btnLogin").hidden = !!u;
  $("#btnLogout").hidden = !u;
}
(function boot(){
  if(!window.firebase || !FIREBASE_CONFIG.apiKey){
    applyRole();
    banner(window.firebase ? "Configuration Firebase manquante : colle ton firebaseConfig en haut du fichier (voir le guide). Mode aperçu, rien n'est enregistré."
                           : "Impossible de charger Firebase (connexion internet ?). Mode aperçu, rien n'est enregistré.");
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();
  db.settings({ignoreUndefinedProperties:true});
  auth=firebase.auth();
  $("#btnLogin").onclick=async()=>{
    try{ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); location.reload(); }
    catch(e){ banner("Connexion impossible ("+(e.code||"erreur")+"). Vérifie que ce site est dans les domaines autorisés de Firebase."); }
  };
  $("#btnLogout").onclick=async()=>{ await auth.signOut(); location.reload(); };
  auth.onAuthStateChanged(async u=>{
    showLogin(u);
    if(started) return; started=true;
    const isGM = !!u && !!GM_UID && u.uid===GM_UID;
    S.role = isGM ? "gm" : "player";
    applyRole(); render();
    if(u && !GM_UID){
      banner("Ton identifiant MJ : "+u.uid+" — copie-le dans GM_UID (en haut de index.html) et dans les règles Firestore, puis recharge.");
    } else if(u && !isGM){
      banner("Ce compte n'est pas celui du MJ : tu vois la vue joueurs.");
    }
    if(!isGM){ startPlayer(); return; }
    BASE=`data/users/${u.uid}/gm/`;
    assets=makeAssets();
    try{ await importSeed(); }
    catch(e){ banner("Accès refusé à tes données ("+(e.code||"erreur")+"). Vérifie les règles Firestore et GM_UID."); return; }
    startGM();
  });
})();
</script>
